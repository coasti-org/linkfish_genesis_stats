sql: "-- dataset for debugging the deck.gl polygon chart type\n\nSELECT 'Area 1' AS\
  \ name, 10 AS value,\n'[[[9.80,53.50],[9.85,53.50],[9.85,53.55],[9.80,53.55],[9.80,53.50]]]'\
  \ AS polygon\n\nUNION ALL\n\nSELECT 'Area 2', 20,\n'[[[9.90,53.50],[9.95,53.50],[9.95,53.55],[9.90,53.55],[9.90,53.50]]]'\n\
  \nUNION ALL\n\nSELECT 'Area 3', 30,\n'[[[10.00,53.50],[10.05,53.50],[10.05,53.55],[10.00,53.55],[10.00,53.50]]]'\n\
  \nUNION ALL\n\nSELECT 'Area 4', 40,\n'[[[10.10,53.50],[10.15,53.50],[10.15,53.55],[10.10,53.55],[10.10,53.50]]]'\n\
  \nUNION ALL\n\nSELECT 'Area 5', 50,\n'[[[10.20,53.50],[10.25,53.50],[10.25,53.55],[10.20,53.55],[10.20,53.50]]]'\n\
  \nUNION ALL\n\n\nSELECT 'Area 6 (Multi)', 60,\n'{   \"type\": \"MultiPolygon\",\n\
  \    \"coordinates\": [\n      [\n        [\n          [9.80,53.60],\n         \
  \ [9.85,53.60],\n          [9.85,53.65],\n          [9.80,53.65],\n          [9.80,53.60]\n\
  \        ]\n      ],\n      [\n        [\n          [9.90,53.60],\n          [9.95,53.60],\n\
  \          [9.95,53.65],\n          [9.90,53.65],\n          [9.90,53.60]\n    \
  \    ]\n      ]\n    ]\n}'\n\nUNION ALL\n\nSELECT\n  'Area 7 (cutout)',\n  70,\n\
  \  '{\n    \"type\": \"Polygon\",\n    \"coordinates\": [\n      [\n        [10.00,\
  \ 53.60],\n        [10.05, 53.60],\n        [10.05, 53.65],\n        [10.00, 53.65],\n\
  \        [10.00, 53.60]\n      ],\n      [\n        [10.015, 53.615],\n        [10.035,\
  \ 53.615],\n        [10.035, 53.635],\n        [10.015, 53.635],\n        [10.015,\
  \ 53.615]\n      ]\n    ]\n  }'\n\nUNION ALL\n\nSELECT 'Area 8', 80,\n'[[[10.10,53.60],[10.15,53.60],[10.15,53.65],[10.10,53.65],[10.10,53.60]]]'\n\
  \nUNION ALL\n\nSELECT 'Area 9', 90,\n'[[[10.20,53.60],[10.25,53.60],[10.25,53.65],[10.20,53.65],[10.20,53.60]]]'\n\
  \nUNION ALL\n\nSELECT 'Area 10', 100,\n'[[[10.30,53.60],[10.35,53.60],[10.35,53.65],[10.30,53.65],[10.30,53.60]]]'"
