sql: "-- Superset Dataset for Deck.GL polygon:\n-- This dynamically colours the polygons\
  \ based on the value of 'wert_anteilig' using\n-- predefined thresholds (schwellenwerte).\n\
  -- this is the code used in superset datasets - for demonstration purposes only,\
  \ not\n-- to be used in production as is.\n-- TODO: Sind die Schwellenwerte in Prozent?\n\
  {%- set schwellenwerte = [\n    {\"max\": 0.35, \"colour\": \"#D4DFF4\"},\n    {\"\
  max\": 0.7, \"colour\": \"#CCD4E6\"},\n    {\"max\": 1.5, \"colour\": \"#99A8CC\"\
  },\n    {\"max\": 5, \"colour\": \"#667DB3\"},\n    {\"max\": 15, \"colour\": \"\
  #335199\"},\n    {\"max\": none, \"colour\": \"#002680\"},\n] %}\n\nwith\n    base\
  \ as (\n        select *\n        from plmart_sup.ds_kreis_kennzahl_geojson\n  \
  \      where\n            kennzahl in (\n                'Altenquotient (Kreis)',\n\
  \                'Anzahl Einwohner:innen (Kreis)',\n                'Durchschnittsalter\
  \ (Kreis)',\n                'Gebietsfl\xE4che (Kreis)',\n                'Lebendgeburten\
  \ (Kreis)',\n                'Medianalter (Kreis)',\n                'Sterbef\xE4\
  lle (Kreis)',\n                'Fortz\xFCge (Kreis)',\n                'Zuz\xFC\
  ge (Kreis)'\n            )\n    ),\n\n    colored as (\n        select\n       \
  \     base.*,\n            case\n                {%- for schwellenwert in schwellenwerte\
  \ %}\n                    {%- if schwellenwert.max is not none %}\n            \
  \            when \"Wert anteilig\" <= {{ schwellenwert.max }}\n               \
  \         then\n                            replace(\n                         \
  \       \"Kreis GeoJson\",\n                                '#REPLACE_ME',\n   \
  \                             '{{ schwellenwert.colour }}'\n                   \
  \         )\n                    {%- else %}\n                        when \"Wert\
  \ anteilig\" > 15\n                        then\n                            replace(\n\
  \                                \"Kreis GeoJson\",\n                          \
  \      '#REPLACE_ME',\n                                '{{ schwellenwert.colour\
  \ }}'\n                            )\n                    {%- endif %}\n       \
  \         {%- endfor %}\n                else replace(\"Kreis GeoJson\", '#REPLACE_ME',\
  \ '#F2F2F2')\n            end as \"Kreis GeoJson colored\"\n        from base\n\
  \    )\n\nselect *\nfrom colored\n"
